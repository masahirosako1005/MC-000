<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 外部通信を一切許可しない（ローカル完結） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:;">
  <title>星占い - Local Horoscope</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="container">
    <header>
      <h1>✦ 星占い ✦</h1>
      <p class="sub">このPCの中だけで動く、あなたの星読みアプリ</p>
    </header>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="fortune" role="tab">今日の運勢</button>
      <button class="tab" data-tab="match" role="tab">相性占い</button>
      <button class="tab" data-tab="list" role="tab">星座一覧</button>
    </nav>

    <!-- 運勢 -->
    <section id="tab-fortune" class="panel active">
      <form id="fortune-form" class="card form">
        <label>生年月日
          <input type="date" id="birthday" required min="1900-01-01">
        </label>
        <label>占う日
          <input type="date" id="target-date" required>
        </label>
        <label class="check">
          <input type="checkbox" id="remember" checked> 生年月日をこのPCに保存する
        </label>
        <button type="submit" class="primary">占う</button>
      </form>
      <div id="fortune-result" class="result" hidden></div>
    </section>

    <!-- 相性 -->
    <section id="tab-match" class="panel">
      <form id="match-form" class="card form">
        <label>あなたの生年月日
          <input type="date" id="birthday-a" required min="1900-01-01">
        </label>
        <label>お相手の生年月日
          <input type="date" id="birthday-b" required min="1900-01-01">
        </label>
        <button type="submit" class="primary">相性を見る</button>
      </form>
      <div id="match-result" class="result" hidden></div>
    </section>

    <!-- 一覧 -->
    <section id="tab-list" class="panel">
      <div id="sign-list" class="grid"></div>
    </section>

    <footer>
      <p>※ 占い結果はエンターテインメントです。データは外部へ送信されません。</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
