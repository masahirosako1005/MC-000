<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142f36">
  <meta name="description" content="観光スタンプラリーの企画・再訪施策を管理する運営ダッシュボード">
  <title>運営ダッシュボード | 星凪スタンプラリー</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <a class="skip-link" href="#admin-main">本文へ移動</a>
  <div class="admin-shell">
    <aside class="admin-sidebar">
      <a class="admin-brand" href="#dashboard">
        <span class="brand-symbol">✦</span>
        <span><strong>星凪スタンプラリー</strong><small>運営コンソール</small></span>
      </a>
      <nav id="admin-nav" class="admin-nav" aria-label="管理メニュー"></nav>
      <div class="sidebar-footer">
        <span class="status-dot"></span>
        <div><strong>デモ環境</strong><small>localhost / 自動送信なし</small></div>
      </div>
    </aside>

    <div class="admin-content">
      <header class="admin-topbar">
        <button id="menu-button" class="menu-button" aria-label="メニューを開く" aria-expanded="false">☰</button>
        <div class="topbar-title"><span>運営コンソール</span><strong id="current-section">ダッシュボード</strong></div>
        <div class="topbar-actions">
          <a class="preview-link" href="../#home" target="_blank" rel="noopener">利用者画面を確認 ↗</a>
          <span class="operator-avatar" aria-label="運営担当者">運</span>
        </div>
      </header>
      <main id="admin-main" tabindex="-1"></main>
    </div>
  </div>
  <div id="admin-toast" class="toast-region" aria-live="polite"></div>
  <div id="admin-modal"></div>
  <script type="module" src="./admin.js"></script>
</body>
</html>
