<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f46">
  <meta name="description" content="観光スタンプラリーの次の旅を提案する、旅のつづきミッション">
  <title>旅のつづき | 星凪スタンプラリー</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <div class="app-shell">
    <aside class="side-rail" aria-label="メインナビゲーション">
      <a class="brand" href="#home" aria-label="旅のつづき ホーム">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <span><strong>星凪</strong><small>旅のつづき</small></span>
      </a>
      <nav id="desktop-nav" class="desktop-nav"></nav>
      <div class="rail-note">
        <span>今季のテーマ</span>
        <strong>光と灯りをめぐる秋</strong>
        <small>12月20日まで</small>
      </div>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <a class="mobile-brand" href="#home" aria-label="旅のつづき ホーム"><span>✦</span> 旅のつづき</a>
        <label class="traveler-switch">
          <span class="sr-only">サンプル利用者を選択</span>
          <span id="header-avatar" class="mini-avatar" aria-hidden="true">ひ</span>
          <select id="traveler-select" aria-label="サンプル利用者を選択"></select>
          <span aria-hidden="true">⌄</span>
        </label>
      </header>

      <main id="main-content" tabindex="-1"></main>

      <nav id="mobile-nav" class="mobile-nav" aria-label="メインナビゲーション"></nav>
    </div>
  </div>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
